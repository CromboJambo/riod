[workspace]
members = [".", "riod-client"]
resolver = "2"

[package]
name = "riod"
version = "0.1.0"
edition = "2021"
description = "System resource supervisor — observes, classifies, authorizes, and coordinates existing processes without owning their lifecycle."
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "riod"
path = "src/main.rs"

[lib]
name = "riod"
path = "src/lib.rs"
