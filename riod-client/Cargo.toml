[package]
name = "riod-client"
version = "0.1.0"
edition = "2021"
description = "Client library for the rIOd system resource supervisor. Communicates with the riod daemon over Unix socket JSON-RPC."
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
